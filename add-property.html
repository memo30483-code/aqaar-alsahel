<form>
    <label for="city">المدينة:</label>
    <select id="city" name="city">
        <option value="Ras El Bar">رأس البر</option>
        <option value="Damietta New">دمياط الجديدة</option>
        <option value="Damietta Old">دمياط القديمة</option>
        <option value="New Mansoura">المنصورة الجديدة</option>
        <option value="Gamasa">جمصة</option>
    </select>
    <br><br>
    <label for="price">السعر:</label>
    <input type="number" id="price" name="price" required><br><br>
    <label for="rooms">عدد الغرف:</label>
    <input type="number" id="rooms" name="rooms" required><br><br>
    <label for="area">المساحة:</label>
    <input type="number" id="area" name="area" required><br><br>
    <label for="description">الوصف:</label>
    <textarea id="description" name="description" required></textarea><br><br>
    <label for="images">صور:</label>
    <input type="file" id="images" name="images" required multiple><br><br>
    <input type="button" id="save" value="حفظ" onclick="saveProperty()">
</form>
